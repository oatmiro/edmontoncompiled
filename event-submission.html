<link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <body>

    <!--header-->
    <header class="header">

      <div class="logo">
        <a href="index.html"><img src="siteimages/logo.png"></a>
      </div>

        <nav class="nav-links">
          <ul>
            <li><a href="about.html">about</a></li>
            <li><a href="event-submission.html">submit an event</a></li>
          </ul>
        </nav>


    </header>

    <div class="container">

    <h1>Want to see an event here?</h1>
    <p class="no-margin">More text</p>

    <!--email submission form-->
    
    <form action="https://formsubmit.co/edmontoncompiled@gmail.com" method="POST">
        <!-- Honeypot Spam Protection (Hidden from real users) -->
        <input type="text" name="_honey" style="display:none">
      
        <!-- Disable Captcha (Optional) -->
        <!-- <input type="hidden" name="_captcha" value="false"> -->
      
      
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="coolperson@example.com" required>
        </div>
      
        <div class="form-group">
          <label for="message">Event Details</label>
          <textarea id="message" name="message" rows="5" placeholder="Please share the event name, date, location, any links, and any additional information as needed." required></textarea>
        </div>
      
        <button type="submit">Submit Event</button>
      </form>

      </div>


    <!--footer-->

    <div class="footer">
      <div class="left-footer logo">
        <img src="siteimages/logo.png">

      </div>

      <div class="right-footer">
      <a href="about.html">about</a>

      <p>Have questions? Reach out: <a href="mailto:edmontoncompiled@gmail.com">edmontoncompiled@gmail.com</a></p>
      </div>

    </div>
